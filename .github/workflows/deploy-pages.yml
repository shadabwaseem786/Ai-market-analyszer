name: Deploy V730000 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare V730000 site
        run: |
          rm -rf _site
          mkdir -p _site
          unzip -q India-FNO-Catalyst-Monitor-V730000.zip -d _site
          if [ -f _site/India-FNO-Catalyst-Monitor-V730000.zip ]; then
            rm -f _site/India-FNO-Catalyst-Monitor-V730000.zip
          fi
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
