name: Build Final ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package full repository
        run: zip -r India-FNO-Catalyst-Monitor-FINAL.zip . -x '.git/*'
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: India-FNO-Catalyst-Monitor-FINAL
          path: India-FNO-Catalyst-Monitor-FINAL.zip
          retention-days: 90
